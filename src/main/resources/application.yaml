spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: manual
    retry:
      topic:
        enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      compression-type: lz4
      batch-size: 50000
  application:
    name: post_hub2
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/post_hub2
    username: postgres
    password: root
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: post_hub2
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: post_hub2
server:
  port: 80
logging:
  level:
    org:
      flywaydb: DEBUG
      springframework:
        web: DEBUG
jwt:
